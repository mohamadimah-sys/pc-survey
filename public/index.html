<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرم ارزیابی پیمانکاران</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#0f5c8c;--brand2:#0d7a5f;--line:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.7}
  header.top{background:linear-gradient(90deg,#0f5c8c,#0d7a5f);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header.top h1{margin:0;font-size:17px}
  header.top p{margin:4px 0 0;font-size:12px;opacity:.9}
  main{max-width:900px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--brand);display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #eef2f7;padding-bottom:8px}
  .card h2 .w{font-size:12px;background:#e6f4ee;color:var(--brand2);padding:2px 8px;border-radius:20px}
  .ws-group{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed #eef2f7}
  .ws-group:last-child{border-bottom:none}
  .ws-title{font-size:14px;font-weight:700;color:var(--brand);margin-bottom:8px;padding:6px 10px;background:#f0f6fb;border-radius:8px}
  .item{padding:10px 0;border-bottom:1px dashed #eef2f7}
  .item:last-child{border-bottom:none}
  .it-title{font-size:13.5px;margin-bottom:7px}
  .iw{font-size:11px;color:var(--brand2);background:#e6f4ee;padding:1px 7px;border-radius:12px;margin-inline-start:5px}
  .scale{display:flex;flex-wrap:wrap;gap:5px}
  .scale button{width:36px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;transition:.12s}
  .scale button:hover{border-color:var(--brand)}
  .scale button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;max-width:900px;margin:0 auto;box-shadow:0 -2px 8px rgba(0,0,0,.06);z-index:40}
  .bar .tot{font-weight:700;color:var(--brand);font-size:15px}
  .bar .prog{font-size:12px;color:var(--muted);margin-inline-end:auto}
  button.primary{background:var(--brand);color:#fff;border:none;padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700}
  button.primary:hover{background:#0b4a72}
  button.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);padding:9px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px}
  button.danger{background:#dc2626;color:#fff;border:none;padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700}
  .msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
  .msg.ok{background:#e6f4ee;color:#0a5c46;border:1px solid #b7e4d3}
  .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .msg.warn{background:#fffbeb;color:#7c4a03;border:1px solid #fde68a}
  .hidden{display:none}
  .cbox{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:#fbfcfe;gap:8px;flex-wrap:wrap}
  .cbox.locked{background:#f0fdf4;border-color:#b7e4d3}
  .cbox .st{font-size:12px;margin-top:3px;color:var(--muted)}
  .cbox.locked .st{color:#0a5c46}
  code{font-size:11px;background:#eef2f7;padding:1px 5px;border-radius:4px;word-break:break-all}
  .lockbox{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-size:13px}
</style>
</head>
<body>

<header class="top">
  <h1>فرم ارزیابی عملکرد پیمانکاران</h1>
  <p id="userHeader">در حال بارگذاری...</p>
</header>

<main>
  <section id="scrDenied" class="card hidden">
    <div class="msg err" style="font-size:16px; text-align:center;">
      ⛔ دسترسی غیرمجاز<br><br>
      <span style="font-size:13px; font-weight:normal;">شما از طریق لینک اختصاصی خود وارد نشده‌اید. لطفاً لینک ارسال شده توسط مدیر پروژه را باز کنید.</span>
    </div>
  </section>

  <section id="scrList" class="card hidden">
    <h2 id="listTitle"></h2>
    <div id="listBox"></div>
  </section>

  <section id="scrForm" class="hidden">
    <div class="card">
      <h2 id="formTitle"></h2>
      <div class="hint" id="formHint"></div>
    </div>
    <form id="form" onsubmit="return false;"></form>
    <div id="formMsg"></div>
  </section>

  <section id="scrLocked" class="card hidden">
    <div class="msg ok" style="font-size:15px">✅ ارزیابی با موفقیت <b>ثبت و قفل</b> شد.</div>
    <div id="lockedDetails"></div>
    
    <div style="margin-top:15px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="primary" onclick="downloadCurrentRecord()">⬇️ دانلود فایل JSON</button>
      <button class="ghost" onclick="backToList()">بازگشت به لیست</button>
    </div>

    <div style="margin-top:15px; padding:15px; background:#fffbeb; border:1px dashed #fcd34d; border-radius:10px; text-align:center;">
      <div style="font-size:13px; color:#92400e; margin-bottom:10px;">آیا مدیر پروژه به شما کد بازگشایی داده است؟</div>
      <button class="ghost" style="color:#92400e; border-color:#fcd34d; width:100%;" onclick="promptUnlock()">🔑 ورود کد بازگشایی</button>
    </div>
  </section>
</main>

<div class="bar hidden" id="bar">
  <span class="prog" id="progress">۰ از ۱۷</span>
  <span>امتیاز: <span class="tot" id="total">۰</span> / ۱۰۰</span>
  <button class="ghost" onclick="cancelForm()">انصراف</button>
  <button class="danger" onclick="submitEval()">🔒 ثبت نهایی و قفل</button>
</div>

<script>
const CONFIG = {
  salt: "pc-eval-v2-2025-immutable",
  eitaaEndpoint: "/api/send",
  workshops: [
    { code:"W2",  name:"دانش", supervisor:"مهندس یاقوتی", pin:"1002", contractors:["جلال حیدری زاده","مجتبی مراد زاده قله زو","ابوالفضل عابدیان خور","جعفر آقا بیگی", "پیمانکاری ظریف", "فتاح احمدی بابادی"] },
    { code:"W3",  name:"شهدا", supervisor:"مهندس آخوند زاده", pin:"1003", contractors:["یاسر باقری قلعه جوق","سید محمد ثمره موسوی","نیک سازان برق مشهد","پیمانکاری راه مرد","توسعه اقتصادی فرزام"] },
    { code:"W4",  name:"باب الجواد", supervisor:"مهندس علیدوست", pin:"1004", contractors:["حسن خوش اندام"] },
    { code:"W5",  name:"فردوسی", supervisor:"مهندس خوش طبخ", pin:"1005", contractors:["رادین راه پیمان"], extraContractors:["محمود بیرجندی"] },
    { code:"W6",  name:"ابوذر", supervisor:"مهندس فیروزی", pin:"1006", contractors:["حسن خوش اندام"] },
    { code:"W7",  name:"بسیج", supervisor:"مهندس منتظریان", pin:"1007", contractors:["شرکت گروه مهندسی سورنا سازه آریو","نیک سازان برق مشهد"] },
    { code:"W8",  name:"شارستان", supervisor:"مهندس فلاح", pin:"1008", contractors:["پیمانکاری راه مرد"] },
    { code:"W9",  name:"لینک سه راهی", supervisor:"مهندس فیروزی", pin:"1006", contractors:["شرکت گروه مهندسی سورنا سازه آریو"] },
    { code:"W10", name:"میان تونلی", supervisor:"مهندس کاشف", pin:"1010", contractors:["توسعه اقتصادی فرزام"] }
  ],
  managers: [
    { code:"PM", role:"مدیر پروژه", pin:"2001", assignedContractors: null },
    { code:"CM", role:"مدیر قراردادهای پروژه", pin:"2002", assignedContractors: null },
    { code:"SM", role:"مدیر ساخت پروژه", pin:"2003", assignedContractors: null, excludedContractors: ["تعاونی هشتصد و نود و پنج"] },
    { code:"SPM", role:"مدیر پشتیبانی پروژه", pin:"2004", assignedContractors: ["تعاونی هشتصد و نود و پنج", "محمود بیرجندی", "داناب تهویه پارس گستر"] },
    { code:"PMO", role:"دفتر مدیریت پروژه", pin:"2005", assignedContractors: ["تعاونی هشتصد و نود و پنج"] },
    { code:"TM", role:"مدیر فنی پروژه", pin:"2006", assignedContractors: null }
  ],
  master: { code:"MASTER", role:"مدیر ارشد (کنترل)", name:"مدیر ارشد", pin:"9999" }
};

const CRITERIA = [
  { key:"tech", group:"۱) فنی و اجرایی", gw:30, items:[
    { id:"t1", w:12, t:"کیفیت اجرا و انطباق فنی" }, { id:"t2", w:8, t:"برنامه‌ریزی و کنترل زمان" },
    { id:"t3", w:5, t:"تجهیزات و ماشین‌آلات" }, { id:"t4", w:5, t:"ایمنی، بهداشت و محیط زیست (HSE)" }
  ]},
  { key:"contract", group:"۲) قراردادی و مدیریتی", gw:20, items:[
    { id:"c1", w:8, t:"تعامل و پاسخگویی با کارفرما و ناظر" }, { id:"c2", w:6, t:"مدیریت اداری و مستندسازی" },
    { id:"c3", w:6, t:"حسن سابقه و اعتبار" }
  ]},
  { key:"value", group:"۳) اخلاقی، اعتقادی و سیاسی", gw:20, items:[
    { id:"v1", w:6, t:"پایبندی به ارزش‌های اخلاقی و اعتقادی و کمک‌های مالی در خصوص مسائل محرومیت‌زدایی و فرهنگی" }, 
    { id:"v2", w:4, t:"رفتار سیاسی مسئولانه" },
    { id:"v3", w:4, t:"صداقت، شفافیت و سلامت اداری" }, { id:"v4", w:4, t:"کرامت، عدالت و عدم تبعیض" }, { id:"v5", w:2, t:"فرهنگ سازمانی" }
  ]},
  { key:"hr", group:"۴) نیروی انسانی و حقوق کارکنان", gw:30, items:[
    { id:"h1", w:12, t:"پرداخت به‌موقع حقوق" }, { id:"h2", w:8, t:"بیمه و تأمین اجتماعی" },
    { id:"h3", w:5, t:"رفاه، ایمنی روانی و شرایط کار" }, { id:"h4", w:5, t:"آموزش و توانمندسازی" }
  ]}
];
const ALL_ITEMS = CRITERIA.flatMap(g=>g.items.map(i=>({...i,gkey:g.key})));
const TOTAL_ITEMS = ALL_ITEMS.length;
const LS_LOCKS = "pc_eval_locks_v2";
const LS_RECS  = "pc_eval_sup_records_v2";

let currentUser = null, curTarget = null, scores = {}, lastRec = null;

function toFa(n){ return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]); }
function simpleHash(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(16).padStart(8,"0") + (h1>>>0).toString(16).padStart(8,"0");
}
function weightedTotal(sc){ return ALL_ITEMS.reduce((s,i)=> s + Number(sc[i.id]||0) * i.w, 0) / 10; }
function groupPercent(sc, g){ const sumW = g.items.reduce((s,i)=>s+i.w,0); const got = g.items.reduce((s,i)=> s + Number(sc[i.id]||0)*i.w, 0); return (got / (10*sumW)) * 100; }
function getLocks(){ return JSON.parse(localStorage.getItem(LS_LOCKS) || "{}"); }
function getRecs(){ return JSON.parse(localStorage.getItem(LS_RECS) || "{}"); }
function saveRecs(o){ localStorage.setItem(LS_RECS, JSON.stringify(o)); }
function isLocked(recordId){ return !!getLocks()[recordId]; }
function downloadJSON(obj, fn){ const b = new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = fn; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
function uniq(arr){ return [...new Set(arr)]; }
function allContractors(){ return uniq(CONFIG.workshops.flatMap(w => w.contractors)); }
function contractorWorkshops(name){ return CONFIG.workshops.filter(w => w.contractors.includes(name)); }
function recordHash(r){ return simpleHash(CONFIG.salt + "|" + r.id + "|" + r.supervisor + "|" + r.contractor + "|" + JSON.stringify(r.scores) + "|" + r.total + "|" + r.timestamp); }

function buildForm(){
  const form = document.getElementById("form"); form.innerHTML = "";
  CRITERIA.forEach(g=>{
    const s = document.createElement("section"); s.className = "card";
    let h = `<h2>${g.group} <span class="w">وزن ${g.gw}٪</span></h2>`;
    g.items.forEach(it=>{ h += `<div class="item"><div class="it-title">${it.t} <span class="iw">${it.w}٪</span></div><div class="scale" data-id="${it.id}">${Array.from({length:10},(_,i)=>`<button type="button" data-v="${i+1}">${i+1}</button>`).join("")}</div></div>`; });
    s.innerHTML = h; form.appendChild(s);
  });
  form.addEventListener("click", e=>{
    const btn = e.target.closest(".scale button"); if(!btn) return;
    const wrap = btn.closest(".scale"); scores[wrap.dataset.id] = Number(btn.dataset.v);
    wrap.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===btn)); updateTotal();
  });
}
function updateTotal(){ document.getElementById("progress").textContent = `${toFa(Object.keys(scores).length)} از ${toFa(TOTAL_ITEMS)}`; document.getElementById("total").textContent = toFa(weightedTotal(scores).toFixed(1)); }
function showScreen(name){ ["Denied","List","Form","Locked"].forEach(s=>{ document.getElementById("scr"+s).classList.toggle("hidden", s.toLowerCase() !== name.toLowerCase()); }); document.getElementById("bar").classList.toggle("hidden", name !== "form"); }

function init(){
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("id");
  const userPin = params.get("pin");

  if(!userId || !userPin){
    showScreen("denied"); document.getElementById("userHeader").textContent = "دسترسی غیرمجاز"; return;
  }

  if(userId.startsWith("sup_")){
    const wCode = userId.replace("sup_", "");
    const w = CONFIG.workshops.find(x => x.code === wCode && x.pin === userPin);
    if(w){
      const allWs = CONFIG.workshops.filter(x => x.supervisor === w.supervisor && x.pin === userPin);
      currentUser = { type:"sup", name:w.supervisor, workshops: allWs };
    }
  }
  else if(userId.startsWith("mgr_")){
    const mCode = userId.replace("mgr_", "");
    const m = CONFIG.managers.find(x => x.code === mCode && x.pin === userPin);
    if(m){
      currentUser = { type:"mgr", code:m.code, role:m.role, name:m.name || m.role, assignedContractors: m.assignedContractors, excludedContractors: m.excludedContractors };
    }
  }
  else if(userId === "master"){
    if(userPin === CONFIG.master.pin){
      currentUser = { type:"mgr", code:CONFIG.master.code, role:CONFIG.master.role, name:CONFIG.master.name, isMaster: true, assignedContractors: null };
    }
  }

  if(!currentUser){
    showScreen("denied"); document.getElementById("userHeader").textContent = "کد امنیتی اشتباه است"; return;
  }

  document.getElementById("userHeader").textContent = `خوش آمدید، ${currentUser.name}`;
  document.getElementById("listTitle").textContent = currentUser.type === "sup" ? `کارگاه‌های تحت مسئولیت شما` : `ارزیابی پیمانکاران`;
  buildForm(); showScreen("list"); renderList();
}

function renderList(){
  const box = document.getElementById("listBox"); box.innerHTML = "";
  
  if(currentUser.type === "sup"){
    currentUser.workshops.forEach(w=>{
      const group = document.createElement("div"); group.className = "ws-group"; group.innerHTML = `<div class="ws-title">🏗️ ${w.name}</div>`;
      const allC = [...w.contractors, ...(w.extraContractors || [])];

      allC.forEach(c=>{
        const id = `sup|${w.code}|${c}`, locked = isLocked(id);
        const d = document.createElement("div"); d.className = "cbox" + (locked ? " locked" : "");
        d.innerHTML = `<div style="flex:1"><b>${c}</b><div class="st">${locked ? "🔒 ثبت شده" : "بدون ارزیابی"}</div></div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            ${locked ? 
              `<button class="ghost" onclick="redownload('${id}')">⬇️ دانلود</button>
               <button class="ghost" style="color:#92400e;border-color:#fcd34d;" onclick="promptUnlock('${esc(id)}')">🔑 بازگشایی</button>` 
              : 
              `<button class="primary" onclick="openForm('${w.code}','${esc(c)}')">شروع ارزیابی</button>`}
          </div>`;
        group.appendChild(d);
      }); 
      box.appendChild(group);
    });
  } else {
    if(currentUser.isMaster) {
      const resetBtn = document.createElement("button");
      resetBtn.className = "danger";
      resetBtn.style.width = "100%";
      resetBtn.style.marginBottom = "15px";
      resetBtn.textContent = "🔄 ریست کامل حافظه این دستگاه (مخصوص مدیر ارشد)";
      resetBtn.onclick = () => {
        if(confirm("آیا مطمئن هستید؟ تمام قفل‌ها و ارزیابی‌های ثبت‌شده در این دستگاه پاک می‌شوند.")) {
          localStorage.removeItem(LS_LOCKS);
          localStorage.removeItem(LS_RECS);
          location.reload();
        }
      };
      box.appendChild(resetBtn);
    }

    let listToRender = [];
    if (currentUser.assignedContractors && currentUser.assignedContractors.length > 0) {
      listToRender = currentUser.assignedContractors;
    } else {
      listToRender = allContractors();
      if (currentUser.excludedContractors && currentUser.excludedContractors.length > 0) {
         listToRender = listToRender.filter(c => !currentUser.excludedContractors.includes(c));
      }
    }

    listToRender.forEach(c=>{
      const id = `mgr|${currentUser.code}|${c}`, locked = isLocked(id);
      const ws = contractorWorkshops(c).map(w=>w.name).join(" ، ") || "—";
      const d = document.createElement("div"); d.className = "cbox" + (locked ? " locked" : "");
      d.innerHTML = `<div style="flex:1"><b>${c}</b><div class="st">کارگاه: ${ws}</div><div class="st">${locked ? "🔒 ثبت شده" : "بدون ارزیابی"}</div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">
          ${locked ? 
            `<button class="ghost" onclick="redownload('${id}')">⬇️ دانلود</button>
             <button class="ghost" style="color:#92400e;border-color:#fcd34d;" onclick="promptUnlock('${esc(id)}')">🔑 بازگشایی</button>` 
            : 
            `<button class="primary" onclick="openFormMgr('${esc(c)}')">شروع ارزیابی</button>`}
        </div>`;
      box.appendChild(d);
    });
  }
}
function esc(s){ return s.replace(/'/g,"\\'"); }

function openForm(workshopCode, contractor){
  const id = `sup|${workshopCode}|${contractor}`; if(isLocked(id)) return alert("قبلاً ثبت شده.");
  const w = CONFIG.workshops.find(x=>x.code===workshopCode);
  curTarget = { workshopCode, workshopName:w.name, contractor }; scores = {}; document.querySelectorAll(".scale button").forEach(b=>b.classList.remove("on")); updateTotal();
  document.getElementById("formTitle").textContent = `ارزیابی: ${contractor}`; document.getElementById("formHint").textContent = `کارگاه: ${w.name} — رئیس کارگاه: ${currentUser.name}`;
  document.getElementById("formMsg").innerHTML = `<div class="msg warn">⚠️ با ثبت نهایی، امتیازها دائماً قفل می‌شوند.</div>`; showScreen("form"); window.scrollTo({top:0, behavior:"smooth"});
}
function openFormMgr(contractor){
  const id = `mgr|${currentUser.code}|${contractor}`; if(isLocked(id)) return alert("قبلاً ثبت شده.");
  curTarget = { contractor, isMgr:true }; scores = {}; document.querySelectorAll(".scale button").forEach(b=>b.classList.remove("on")); updateTotal();
  document.getElementById("formTitle").textContent = `ارزیابی: ${contractor}`;
  document.getElementById("formHint").textContent = `کارگاه‌ها: ${contractorWorkshops(contractor).map(w=>w.name).join(" ، ") || "—"} — ارزیاب: ${currentUser.role}`;
  document.getElementById("formMsg").innerHTML = `<div class="msg warn">⚠️ با ثبت نهایی، امتیازها دائماً قفل می‌شوند.</div>`; showScreen("form"); window.scrollTo({top:0, behavior:"smooth"});
}
function cancelForm(){ if(Object.keys(scores).length > 0 && !confirm("انصراف؟")) return; curTarget = null; scores = {}; showScreen("list"); renderList(); }
function backToList(){ curTarget = null; scores = {}; lastRec = null; showScreen("list"); renderList(); }

async function submitEval(){
  if(!currentUser || !curTarget) return;
  const missing = ALL_ITEMS.filter(it=> scores[it.id] === undefined);
  if(missing.length){ document.getElementById("formMsg").innerHTML = `<div class="msg err">${toFa(missing.length)} شاخص بدون امتیاز مانده است.</div>`; return; }
  if(!confirm(`ثبت نهایی؟\n\n• ارسال به ایتا\n• پس از ثبت، امکان تغییر وجود ندارد.`)) return;

  const ts = new Date().toISOString();
  const isMgr = !!curTarget.isMgr;
  const id = isMgr ? `mgr|${currentUser.code}|${curTarget.contractor}` : `sup|${curTarget.workshopCode}|${curTarget.contractor}`;
  if(isLocked(id)){ return alert("قبلاً ثبت شده."); }

  const rec = {
    version: 2, id, evaluatorType: isMgr ? "manager" : "supervisor",
    evaluatorCode: isMgr ? currentUser.code : curTarget.workshopCode,
    supervisor: isMgr ? currentUser.role : currentUser.name,
    evaluatorRole: isMgr ? currentUser.role : "رئیس کارگاه",
    contractor: curTarget.contractor,
    workshopCode: isMgr ? null : curTarget.workshopCode,
    workshopName: isMgr ? contractorWorkshops(curTarget.contractor).map(w=>w.name).join(" ، ") : curTarget.workshopName,
    timestamp: ts, scores: {...scores}, total: Number(weightedTotal(scores).toFixed(2)),
    groups: Object.fromEntries(CRITERIA.map(g=>[g.key, Number(groupPercent(scores,g).toFixed(2))])),
    locked: true
  };
  rec.hash = recordHash(rec);

  const locks = getLocks(); locks[id] = { hash:rec.hash, timestamp:ts }; localStorage.setItem(LS_LOCKS, JSON.stringify(locks));
  const recs = getRecs(); recs[id] = rec; saveRecs(recs); lastRec = rec;

  const fileName = `نظرسنجی_${rec.supervisor}_${rec.contractor}.json`;

  let eitaaStatus = "skipped", eitaaErrorMsg = "";

  if(CONFIG.eitaaEndpoint){
    document.getElementById("formMsg").innerHTML = `<div class="msg warn">⏳ در حال ارسال به ایتا...</div>`;
    try {
      const res = await fetch(CONFIG.eitaaEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ record: rec, fileName }) });
      const json = await res.json();
      if (json.status === "ok") { eitaaStatus = "sent"; } else { eitaaStatus = "failed"; eitaaErrorMsg = json.message || "خطای ناشناخته"; }
    } catch(err){ eitaaStatus = "failed"; eitaaErrorMsg = "خطای شبکه"; }
  }

  downloadJSON([rec], fileName);

  const statusHtml = eitaaStatus === "sent" ? `<div class="msg ok">📨 فایل با موفقیت به ایتا ارسال شد.</div>` : eitaaStatus === "failed" ? `<div class="msg err">⚠️ ارسال ناموفق: ${eitaaErrorMsg}<br>فایل پشتیبان دانلود شد.</div>` : "";

  document.getElementById("lockedDetails").innerHTML = `
    ${statusHtml}
    <div class="lockbox">
      <div><b>پیمانکار:</b> ${rec.contractor}</div>
      <div><b>کارگاه:</b> ${rec.workshopName || "—"}</div>
      <div><b>ارزیاب:</b> ${rec.supervisor}</div>
      <div><b>تاریخ:</b> ${new Date(ts).toLocaleString("fa-IR")}</div>
      <div><b>امتیاز نهایی:</b> <b style="color:#0f5c8c">${toFa(rec.total)}</b> از ۱۰۰</div>
    </div>
  `;
  showScreen("locked"); window.scrollTo({top:0, behavior:"smooth"});
}

function downloadCurrentRecord(){ if(lastRec){ downloadJSON([lastRec], `نظرسنجی_${lastRec.supervisor}_${lastRec.contractor}.json`); } }
function redownload(id){ const recs = getRecs(); const r = recs[id]; if(!r) return alert("رکورد یافت نشد."); downloadJSON([r], `نظرسنجی_${r.supervisor}_${r.contractor}.json`); }

function makeUnlockCode(recordId) {
  const secret = "ADMIN-UNLOCK-KEY-2025";
  return simpleHash(secret + "|" + recordId).slice(0, 8).toUpperCase();
}

function promptUnlock(recordId) {
  const id = recordId || (lastRec ? lastRec.id : null);
  if (!id) return alert("خطا: رکورد یافت نشد.");
  const code = prompt("کد بازگشایی را از مدیر پروژه بگیرید و اینجا وارد کنید:");
  if (code === null) return;
  const expected = makeUnlockCode(id);
  if (code.trim().toUpperCase() !== expected) {
    alert("❌ کد بازگشایی نامعتبر است.\nکد را از مدیر پروژه دریافت کنید.");
    return;
  }
  if (!confirm("کد صحیح است. قفل این ارزیابی باز شود؟")) return;
  const locks = getLocks(); delete locks[id]; localStorage.setItem(LS_LOCKS, JSON.stringify(locks));
  const recs = getRecs(); delete recs[id]; saveRecs(recs);
  alert("✅ قفل باز شد. حالا می‌توانید دوباره ارزیابی کنید.");
  backToList();
}

init();
</script>
